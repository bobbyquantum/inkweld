name: Deploy Cloudflare (Preview)

on:
  push:
    branches: ["main"]

concurrency:
  group: deploy-cloudflare-preview
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-preview:
    name: Deploy Preview
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-cloudflare-reusable.yml
    # A reusable workflow only sees the secrets its caller hands it; with
    # inherit, the called job also resolves its GitHub environment's secrets
    # (which take precedence over repository secrets of the same name).
    secrets: inherit
    with:
      environment: preview
      pages-project: inkweld-frontend-preview
      d1-database: inkweld_preview
      angular-configuration: preview
      environment-file: environment.preview.ts
      # The preview keeps its hosted apiUrl (used to pre-fill the server step)
      # but shows the setup screen so users can choose Browser / Cloud Sync /
      # Server mode instead of being auto-connected.
      auto-configure: false
      url-secret-prefix: PREVIEW
