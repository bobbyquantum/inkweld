name: Release Please

# Keeps a release PR open that bumps the version (package.json files and the
# x-release-please-version lines) and prepends a CHANGELOG entry built from
# the Conventional Commit titles merged since the last release. Merging that
# PR tags vX.Y.Z, creates the GitHub release, and builds the Docker image
# through release.yml. Once the image is published it promotes the release to
# production (inkweld.app). It also thanks first-time contributors in that
# release.
# See docs/site/docs/admin-guide/ci-cd.md#releasing.
#
# Needs "Allow GitHub Actions to create and approve pull requests"
# (Settings → Actions → General) to open the release PR.

on:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please writes `* **editor:** …`; put each scope's emoji from
      # .github/commit-scopes.json in front. It rebuilds the release PR on
      # every run, so this runs every time. The PR body becomes the GitHub
      # release notes when the PR is merged.
      - name: Check out the release PR
        if: steps.release.outputs.pr
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}

      - name: Add scope emoji to the release PR
        if: steps.release.outputs.pr
        # A step's env is evaluated even when its `if` skips it, and fromJSON
        # fails on the empty output of a run with no release PR, which fails the
        # job. So the PR number is read in the script instead.
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          PR_NUMBER="$(jq -r .number <<< "$RELEASE_PR")"

          node scripts/add-scope-emoji.mjs --changelog CHANGELOG.md
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --all --message "chore: add scope emoji to the changelog"
            git push
          fi

          body="$RUNNER_TEMP/release-pr-body.md"
          gh pr view "$PR_NUMBER" --json body --jq .body > "$body"
          cp "$body" "$body.orig"
          node scripts/add-scope-emoji.mjs --notes "$body"
          if ! cmp --silent "$body" "$body.orig"; then
            gh pr edit "$PR_NUMBER" --body-file "$body"
          fi

  # A tag created with GITHUB_TOKEN does not trigger release.yml's tag push,
  # so the release build is called directly. It also runs if a later step of
  # the job above fails: once the tag exists, the release still needs its image.
  docker-release:
    name: Docker release
    needs: release-please
    if: ${{ !cancelled() && needs.release-please.outputs.releases_created == 'true' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

  # Once the release image is published, inkweld.app moves to the release
  # commit: `production` is fast-forwarded to the tag and its deploy started.
  # The ref update is not forced, so it fails rather than move production off
  # main; if production already has the release (promoted by hand), it is left
  # alone, and deployed only if no deploy has run for that commit. A branch update made with GITHUB_TOKEN doesn't trigger
  # deploy-cloudflare-production.yml's push trigger, so the deploy is started
  # with workflow_dispatch, which GITHUB_TOKEN can trigger.
  promote-production:
    name: Promote to production
    needs: [release-please, docker-release]
    if: ${{ !cancelled() && needs.docker-release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - name: Fast-forward production and deploy it
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq .sha)"
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${sha}...production" --jq .status)"
          case "$status" in
            ahead)
              echo "::notice::production is already past ${RELEASE_TAG}; not moving it."
              exit 0
              ;;
            identical)
              # Promoted already, by hand or by an earlier attempt of this job
              # whose dispatch failed. Deploy only if nothing has for this commit.
              deploys="$(gh run list --repo "$GITHUB_REPOSITORY" \
                --workflow deploy-cloudflare-production.yml --commit "$sha" \
                --json databaseId --jq length)"
              if [[ "$deploys" != "0" ]]; then
                echo "::notice::production is already at ${RELEASE_TAG} and has a deploy."
                exit 0
              fi
              ;;
            *)
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/production" \
                -f sha="$sha" -F force=false > /dev/null
              echo "::notice::production fast-forwarded to ${RELEASE_TAG} (${sha})."
              ;;
          esac
          gh workflow run deploy-cloudflare-production.yml \
            --repo "$GITHUB_REPOSITORY" --ref production

  # release-please's notes name no one. This adds GitHub's own list of
  # first-time contributors (its "New Contributors" section) to the release;
  # scripts/thank-new-contributors.mjs explains how. A thank-you must never get
  # in the way of a release, so this job is a sibling of docker-release rather
  # than a step before it, and continue-on-error keeps its failure from failing
  # the run. If it fails, run the script by hand to add the section later.
  thank-contributors:
    name: Thank new contributors
    needs: release-please
    if: ${{ !cancelled() && needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Add the New Contributors section to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: node scripts/thank-new-contributors.mjs --tag "$RELEASE_TAG"
