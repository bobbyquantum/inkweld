name: Release Please

# Keeps a release PR open that bumps the version (package.json files and the
# x-release-please-version lines) and prepends a CHANGELOG entry built from
# the Conventional Commit titles merged since the last release. Merging that
# PR tags vX.Y.Z, creates the GitHub release, and builds the Docker image
# through release.yml. See docs/site/docs/admin-guide/ci-cd.md#releasing.
#
# Needs "Allow GitHub Actions to create and approve pull requests"
# (Settings → Actions → General) to open the release PR.

on:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A tag created with GITHUB_TOKEN does not trigger release.yml's tag push,
  # so the release build is called directly.
  docker-release:
    name: Docker release
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
