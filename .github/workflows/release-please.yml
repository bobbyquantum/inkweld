name: Release Please

# Keeps a release PR open that bumps the version (package.json files and the
# x-release-please-version lines) and prepends a CHANGELOG entry built from
# the Conventional Commit titles merged since the last release. Merging that
# PR tags vX.Y.Z, creates the GitHub release, and builds the Docker image
# through release.yml. See docs/site/docs/admin-guide/ci-cd.md#releasing.
#
# Needs "Allow GitHub Actions to create and approve pull requests"
# (Settings → Actions → General) to open the release PR.

on:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please writes `* **editor:** …`; put each scope's emoji from
      # .github/commit-scopes.json in front. It rebuilds the release PR on
      # every run, so this runs every time. The PR body becomes the GitHub
      # release notes when the PR is merged.
      - name: Check out the release PR
        if: steps.release.outputs.pr
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}

      - name: Add scope emoji to the release PR
        if: steps.release.outputs.pr
        # A step's env is evaluated even when its `if` skips it, and fromJSON
        # fails on the empty output of a run with no release PR, which fails the
        # job. So the PR number is read in the script instead.
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          PR_NUMBER="$(jq -r .number <<< "$RELEASE_PR")"

          node scripts/add-scope-emoji.mjs --changelog CHANGELOG.md
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --all --message "chore: add scope emoji to the changelog"
            git push
          fi

          body="$RUNNER_TEMP/release-pr-body.md"
          gh pr view "$PR_NUMBER" --json body --jq .body > "$body"
          cp "$body" "$body.orig"
          node scripts/add-scope-emoji.mjs --notes "$body"
          if ! cmp --silent "$body" "$body.orig"; then
            gh pr edit "$PR_NUMBER" --body-file "$body"
          fi

  # A tag created with GITHUB_TOKEN does not trigger release.yml's tag push,
  # so the release build is called directly. It also runs if a later step of
  # the job above fails: once the tag exists, the release still needs its image.
  docker-release:
    name: Docker release
    needs: release-please
    if: ${{ !cancelled() && needs.release-please.outputs.releases_created == 'true' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
