    <text x="54" y="72" font-size="12" font-weight="700" letter-spacing="2" fill="#ef4444">YOUR BROWSER</text>
    <text x="54" y="98" font-size="20" font-weight="700" fill="#f4f4f5">Angular PWA</text>
  <g>
    <rect x="54" y="122" width="302" height="52" rx="10" fill="#1f1f23" stroke="#3f3f46"/>
