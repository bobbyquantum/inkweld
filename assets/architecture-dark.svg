  <g>
    <rect x="30" y="410" width="860" height="70" rx="14" fill="#1f1f23" stroke="#3f3f46" stroke-dasharray="6 4"/>
    <text x="54" y="436" font-size="12" font-weight="700" letter-spacing="2" fill="#ef4444">CLOUD SYNC  ·  OPTIONAL, NO INKWELD SERVER</text>
    <text x="54" y="460" font-size="13" fill="#f4f4f5">Your own Dropbox or Nextcloud mirrors your projects · the browser talks to the provider directly · multi-device, no account</text>
    <line x1="205" y1="390" x2="205" y2="410" stroke="#52525b" stroke-width="2" stroke-dasharray="4 4"/>
  </g>
  <text x="460.0" y="512" text-anchor="middle" font-size="12" fill="#a1a1aa">Runs as a Docker image, a native Bun binary, or a Cloudflare Worker · client ships as PWA, Android TWA, or Electron desktop app</text>
