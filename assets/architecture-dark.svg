    <text x="580" y="224" font-size="12" fill="#a1a1aa">WebSocket fan-out of Yjs updates</text>
  </g>
  <g>
    <rect x="564" y="246" width="302" height="52" rx="10" fill="#1f1f23" stroke="#3f3f46"/>
