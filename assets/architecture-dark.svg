    <text x="580" y="286" font-size="12" fill="#a1a1aa">SQLite (Drizzle) · LevelDB docs · media</text>
  </g>
  <g>
    <rect x="564" y="308" width="302" height="52" rx="10" fill="#1f1f23" stroke="#3f3f46"/>
