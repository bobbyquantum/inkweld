<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Inkweld architecture</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
    </marker>
  </defs>
  <g>
    <rect x="30" y="30" width="350" height="360" rx="18" fill="#161618" stroke="#3f3f46" stroke-width="1.5"/>
