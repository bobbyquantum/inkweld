    <text x="70" y="162" font-size="12" fill="#a1a1aa">ProseMirror · Zen mode · comments</text>
  </g>
  <g>
    <rect x="54" y="184" width="302" height="52" rx="10" fill="#1f1f23" stroke="#3f3f46"/>
    <text x="70" y="206" font-size="14" font-weight="600" fill="#f4f4f5">Worldbuilding &amp; canvas</text>
    <text x="70" y="224" font-size="12" fill="#a1a1aa">Elements, maps, timelines, charts</text>
  </g>
  <g>
    <rect x="54" y="246" width="302" height="52" rx="10" fill="#1f1f23" stroke="#3f3f46"/>
    <text x="70" y="268" font-size="14" font-weight="600" fill="#f4f4f5">Local-first storage</text>
    <text x="70" y="286" font-size="12" fill="#a1a1aa">IndexedDB · works fully offline</text>
  </g>
  <g>
    <rect x="54" y="308" width="302" height="52" rx="10" fill="#1f1f23" stroke="#3f3f46"/>
