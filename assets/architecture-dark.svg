    <text x="70" y="348" font-size="12" fill="#a1a1aa">Conflict-free, mergeable edits</text>
  </g>
  </g>
  <g>
    <rect x="540" y="30" width="350" height="360" rx="18" fill="#161618" stroke="#3f3f46" stroke-width="1.5"/>
    <rect x="540" y="30" width="350" height="6" rx="3" fill="#ef4444"/>
    <text x="564" y="72" font-size="12" font-weight="700" letter-spacing="2" fill="#ef4444">SYNC SERVER  ·  OPTIONAL</text>
    <text x="564" y="98" font-size="20" font-weight="700" fill="#f4f4f5">Hono API on Bun</text>
  <g>
    <rect x="564" y="122" width="302" height="52" rx="10" fill="#1f1f23" stroke="#3f3f46"/>
    <text x="580" y="144" font-size="14" font-weight="600" fill="#f4f4f5">Accounts &amp; sharing</text>
