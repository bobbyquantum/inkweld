  </g>
  </g>
  <g>
    <line x1="386" y1="178" x2="534" y2="178" stroke="#ef4444" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <text x="460.0" y="168" text-anchor="middle" font-size="12" font-weight="600" fill="#f4f4f5">REST</text>
    <line x1="386" y1="230" x2="534" y2="230" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 5" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <text x="460.0" y="252" text-anchor="middle" font-size="12" font-weight="600" fill="#f4f4f5">WebSocket</text>
    <text x="460.0" y="268" text-anchor="middle" font-size="11" fill="#a1a1aa">live document sync</text>
    <rect x="398.0" y="296" width="124" height="24" rx="12" fill="#3b0f0f"/>
    <text x="460.0" y="312" text-anchor="middle" font-size="11" font-weight="600" fill="#f87171">offline without it</text>
