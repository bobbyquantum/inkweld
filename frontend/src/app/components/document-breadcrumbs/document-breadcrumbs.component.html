@if (visible()) {
  <nav
    class="document-breadcrumbs"
    [attr.aria-label]="'project.breadcrumbs.ariaLabel' | transloco"
    [matTooltip]="fullPath()"
    matTooltipShowDelay="600"
    data-testid="document-breadcrumbs">
    @for (segment of segments(); track segment.id; let isLast = $last) {
      @if (!isLast) {
        <button
          type="button"
          class="breadcrumb-segment breadcrumb-segment-button"
          [matMenuTriggerFor]="segMenu.menu"
          [attr.aria-haspopup]="'menu'"
          [attr.data-testid]="'breadcrumb-segment-' + segment.id">
          {{ segment.name }}
        </button>
        <app-element-tree-menu
          #segMenu="appElementTreeMenu"
          [parentId]="segment.id === projectRootId ? null : segment.id"
          [currentBranchId]="segment.nextBranchId" />
        <mat-icon class="breadcrumb-separator" aria-hidden="true">
          chevron_right
        </mat-icon>
      } @else {
        <span class="breadcrumb-segment current" [attr.aria-current]="'page'">
          {{ segment.name }}
        </span>
      }
    }
  </nav>
}
