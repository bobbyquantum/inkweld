<div
  class="ai-preference"
  [class.ai-preference--pill]="pill()"
  data-testid="ai-preference">
  <div
    class="ai-choice"
    role="radiogroup"
    [attr.aria-label]="'settings.generalTab.aiTitle' | transloco">
    @for (option of options; track option.value) {
      <button
        type="button"
        class="ai-choice__option"
        [class.ai-choice__option--selected]="selected() === option.value"
        role="radio"
        matRipple
        [attr.aria-checked]="selected() === option.value"
        [tabIndex]="selected() === option.value ? 0 : -1"
        [attr.data-testid]="'ai-preference-' + option.value"
        (click)="choose(option.value)"
        (keydown)="onKeydown($event)">
        <mat-icon aria-hidden="true">{{
          selected() === option.value ? 'check' : option.icon
        }}</mat-icon>
        <span>{{ option.label | transloco }}</span>
      </button>
    }
  </div>
  <button
    mat-icon-button
    type="button"
    class="ai-preference__help"
    appTooltipAriaLabel
    [matTooltip]="'settings.generalTab.aiHelp' | transloco"
    [attr.aria-label]="'settings.generalTab.aiHelp' | transloco"
    data-testid="ai-preference-help"
    (click)="openInfo()">
    <mat-icon>help_outline</mat-icon>
  </button>
</div>
