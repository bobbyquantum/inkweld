@if (hasPrivacyPolicy() || hasTerms()) {
  <div class="legal-links" data-testid="legal-links">
    @if (hasPrivacyPolicy()) {
      <a
        routerLink="/privacy"
        target="_blank"
        rel="noopener"
        data-testid="legal-privacy-link"
        >{{ 'auth.legal.privacyPolicy' | transloco }}</a
      >
    }
    @if (hasPrivacyPolicy() && hasTerms()) {
      <span class="legal-separator">·</span>
    }
    @if (hasTerms()) {
      <a
        routerLink="/terms"
        target="_blank"
        rel="noopener"
        data-testid="legal-terms-link"
        >{{ 'auth.legal.termsOfService' | transloco }}</a
      >
    }
  </div>
}
