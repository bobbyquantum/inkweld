<div class="page editor-page" data-testid="template-editor-page">
  <header class="editor-toolbar">
    <button
      mat-icon-button
      [attr.aria-label]="'templates.editor.backToTemplates' | transloco"
      [matTooltip]="'templates.editor.backToTemplates' | transloco"
      (click)="cancel()"
      data-testid="template-editor-back">
      <mat-icon>arrow_back</mat-icon>
    </button>

    <div class="toolbar-title">
      <mat-icon>{{ previewSchema()?.icon || 'category' }}</mat-icon>
      <span>{{
        previewSchema()?.name || ('templates.editor.title' | transloco)
      }}</span>
    </div>

    <span class="toolbar-spacer"></span>
    @if (isSaving()) {
      <span class="saving-indicator">
        <mat-icon>cloud_done</mat-icon>
        {{ 'templates.editor.saving' | transloco }}
      </span>
    }
  </header>

  <div class="editor-layout">
    <!-- Single unified editor: fields, schema details, and styling live inside it -->
    <div class="editor-canvas" data-testid="template-preview">
      <app-worldbuilding-editor
        [elementId]="'preview'"
        [elementType]="ElementType.Worldbuilding"
        [username]="'preview'"
        [slug]="'preview'"
        [previewSchema]="previewSchema()"
        [editMode]="true"
        (schemaEdit)="onSchemaEdit($event)"
        (schemaInfoChange)="onSchemaInfoChange($event)"
        (defaultAppearanceChange)="
          onDefaultAppearanceChange($event)
        "></app-worldbuilding-editor>
    </div>
  </div>
</div>
