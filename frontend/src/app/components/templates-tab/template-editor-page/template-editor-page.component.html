<div class="page editor-page" data-testid="template-editor-page">
  <div class="editor-layout">
    <!-- Single unified editor: fields, schema details, and styling live inside it -->
    <div class="editor-canvas" data-testid="template-preview">
      <app-worldbuilding-editor
        [elementId]="'preview'"
        [elementType]="ElementType.Worldbuilding"
        [username]="'preview'"
        [slug]="'preview'"
        [previewSchema]="previewSchema()"
        [editMode]="true"
        (schemaEdit)="onSchemaEdit($event)"
        (schemaInfoChange)="onSchemaInfoChange($event)"
        (defaultAppearanceChange)="
          onDefaultAppearanceChange($event)
        "></app-worldbuilding-editor>
    </div>
  </div>
</div>
