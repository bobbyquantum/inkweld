@if (isOpen()) {
  <div
    class="context-menu-backdrop"
    role="presentation"
    tabindex="-1"
    (click)="close()"
    (keydown.escape)="close()"
    (contextmenu)="$event.preventDefault(); close()"></div>
  <div
    class="context-menu"
    [style.left.px]="menuPosition().x"
    [style.top.px]="menuPosition().y"
    role="menu"
    [attr.aria-label]="'editor.elementRef.contextMenu.ariaLabel' | transloco"
    data-testid="element-ref-context-menu">
    @if (!isEditing()) {
      <!-- Normal menu mode -->
      <button
        class="menu-item"
        (click)="navigateToElement()"
        data-testid="context-menu-navigate">
        <mat-icon>open_in_new</mat-icon>
        <span>{{
          'editor.elementRef.contextMenu.goToElement' | transloco
        }}</span>
      </button>

      <button
        class="menu-item"
        (click)="startEditing()"
        data-testid="context-menu-edit">
        <mat-icon>edit</mat-icon>
        <span>{{
          'editor.elementRef.contextMenu.editDisplayText' | transloco
        }}</span>
      </button>

      <mat-divider></mat-divider>

      <button
        class="menu-item danger"
        (click)="deleteReference()"
        data-testid="context-menu-delete">
        <mat-icon>delete</mat-icon>
        <span>{{
          'editor.elementRef.contextMenu.deleteReference' | transloco
        }}</span>
      </button>
    } @else {
      <!-- Editing mode -->
      <div class="edit-mode">
        <div class="edit-header">
          <span>{{
            'editor.elementRef.contextMenu.editDisplayText' | transloco
          }}</span>
          <button mat-icon-button (click)="cancelEditing()">
            <mat-icon>close</mat-icon>
          </button>
        </div>
        <input
          #editInput
          type="text"
          id="element-ref-edit-text-input"
          [attr.aria-label]="
            'editor.elementRef.contextMenu.editDisplayTextAria' | transloco
          "
          class="edit-input"
          [value]="editText()"
          (input)="editText.set($any($event.target).value)"
          (keydown.enter)="saveEdit()"
          (keydown.escape)="cancelEditing()"
          data-testid="context-menu-edit-input" />
        <div class="edit-actions">
          <button
            class="menu-item small"
            (click)="resetToOriginal()"
            [disabled]="editText() === data()?.originalName">
            <mat-icon>refresh</mat-icon>
            <span>{{
              'editor.elementRef.contextMenu.resetToOriginal' | transloco
            }}</span>
          </button>
          <button
            mat-flat-button
            color="primary"
            (click)="saveEdit()"
            [disabled]="!editText().trim()"
            data-testid="context-menu-save">
            {{ 'editor.elementRef.contextMenu.save' | transloco }}
          </button>
        </div>
      </div>
    }
  </div>
}
