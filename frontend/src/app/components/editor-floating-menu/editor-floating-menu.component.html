<div ngToolbar class="floating-menu" data-testid="editor-floating-menu">
  <button
    ngToolbarWidget
    value="bold"
    [attr.aria-pressed]="isBold()"
    [matTooltip]="'editor.floatingMenu.bold' | transloco"
    (mousedown)="preventFocusLoss($event)"
    (click)="toggleBold()"
    data-testid="floating-bold">
    <mat-icon>format_bold</mat-icon>
  </button>
  <button
    ngToolbarWidget
    value="italic"
    [attr.aria-pressed]="isItalic()"
    [matTooltip]="'editor.floatingMenu.italic' | transloco"
    (mousedown)="preventFocusLoss($event)"
    (click)="toggleItalic()"
    data-testid="floating-italic">
    <mat-icon>format_italic</mat-icon>
  </button>
  <button
    ngToolbarWidget
    value="underline"
    [attr.aria-pressed]="isUnderline()"
    [matTooltip]="'editor.floatingMenu.underline' | transloco"
    (mousedown)="preventFocusLoss($event)"
    (click)="toggleUnderline()"
    data-testid="floating-underline">
    <mat-icon>format_underlined</mat-icon>
  </button>
  <button
    ngToolbarWidget
    value="strike"
    [attr.aria-pressed]="isStrike()"
    [matTooltip]="'editor.floatingMenu.strikethrough' | transloco"
    (mousedown)="preventFocusLoss($event)"
    (click)="toggleStrike()"
    data-testid="floating-strike">
    <mat-icon>strikethrough_s</mat-icon>
  </button>
  <div class="floating-divider"></div>
  <button
    ngToolbarWidget
    value="link"
    [attr.aria-pressed]="isLink()"
    [matTooltip]="'editor.floatingMenu.link' | transloco"
    (mousedown)="preventFocusLoss($event)"
    (click)="toggleLink()"
    data-testid="floating-link">
    <mat-icon>link</mat-icon>
  </button>
  <div class="floating-divider"></div>
  <button
    ngToolbarWidget
    value="comment"
    [matTooltip]="'editor.floatingMenu.comment' | transloco"
    (mousedown)="preventFocusLoss($event)"
    (click)="onAddComment()"
    data-testid="floating-comment">
    <mat-icon>comment</mat-icon>
  </button>
</div>
