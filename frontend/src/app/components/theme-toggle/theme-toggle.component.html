<div class="theme-toggle">
  <button
    mat-icon-button
    (click)="onThemeChange('light-theme')"
    [matTooltip]="'settings.light' | transloco"
    data-testid="theme-light-button"
    [attr.aria-label]="'settings.light' | transloco">
    <mat-icon>light_mode</mat-icon>
  </button>
  <button
    mat-icon-button
    (click)="onThemeChange('dark-theme')"
    [matTooltip]="'settings.dark' | transloco"
    data-testid="theme-dark-button"
    [attr.aria-label]="'settings.dark' | transloco">
    <mat-icon>dark_mode</mat-icon>
  </button>
  <button
    mat-icon-button
    (click)="onThemeChange('system')"
    [matTooltip]="'settings.followSystem' | transloco"
    data-testid="theme-system-button"
    [attr.aria-label]="'settings.followSystem' | transloco">
    <mat-icon>brightness_auto</mat-icon>
  </button>
</div>
