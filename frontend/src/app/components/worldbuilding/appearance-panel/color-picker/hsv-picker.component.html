<div class="hsv-picker" data-testid="hsv-picker">
  <!-- Saturation / value square -->
  <div
    class="sv-square"
    [style.background]="hueColor()"
    (pointerdown)="onSquarePointer($event)"
    (pointermove)="onSquarePointer($event)"
    data-testid="hsv-sv">
    <div
      class="sv-cursor"
      [style.left.%]="svCursorLeft()"
      [style.top.%]="svCursorTop()"></div>
  </div>

  <!-- Hue slider -->
  <label class="hue-label" for="hsv-hue-input">Hue</label>
  <input
    id="hsv-hue-input"
    type="range"
    min="0"
    max="360"
    step="1"
    [value]="hue()"
    (input)="onHueInput($event)"
    class="hue-slider"
    data-testid="hsv-hue" />

  <!-- Footer: swatch + hex input -->
  <div class="hsv-footer">
    <span
      class="swatch"
      [style.background]="selectedColor()"
      data-testid="hsv-swatch"></span>
    <mat-form-field appearance="outline" class="hex-field">
      <input
        matInput
        [value]="value()"
        (input)="onHexInput($event)"
        data-testid="hsv-hex"
        aria-label="Hex colour" />
    </mat-form-field>
  </div>
</div>
