<div class="gradient-designer" data-testid="gradient-designer">
  <!-- Preview bar with draggable stops. Each stop captures the pointer and
       moves along the bar while dragging. -->
  <div
    class="gradient-bar"
    [style.background]="preview()"
    data-testid="gradient-bar">
    @for (stop of stops(); track $index) {
      <div
        class="gradient-stop"
        [class.selected]="$index === selectedIndex()"
        [style.left.%]="stop.position"
        [style.background]="stop.color"
        (pointerdown)="onStopPointerDown($index, $event)"
        (pointermove)="onStopPointerMove($event)"
        (pointerup)="onStopPointerUp($event)"
        (pointercancel)="onStopPointerUp($event)"
        data-testid="gradient-stop"></div>
    }
  </div>

  <!-- Angle slider -->
  <div class="angle-row">
    <label for="gradient-angle">{{
      'worldbuilding.appearance.gradientAngle' | transloco
    }}</label>
    <input
      id="gradient-angle"
      type="range"
      min="0"
      max="360"
      step="1"
      [value]="angle()"
      [disabled]="disabled()"
      (input)="onAngleInput($event)"
      data-testid="gradient-angle" />
    <span class="angle-value">{{ angle() }}°</span>
  </div>

  <!-- Selected stop editor with a colour chooser -->
  @if (stops()[selectedIndex()]; as stop) {
    <div class="stop-editor">
      <app-color-picker
        [value]="stop.color"
        [disabled]="disabled()"
        (valueChange)="onStopColorChange(selectedIndex(), $event)" />
      <div class="stop-actions">
        <button
          mat-icon-button
          type="button"
          [disabled]="disabled() || stops().length <= 2"
          (click)="removeStop()"
          data-testid="gradient-remove-stop">
          <mat-icon>remove</mat-icon>
        </button>
        <button
          mat-icon-button
          type="button"
          [disabled]="disabled()"
          (click)="addStop()"
          data-testid="gradient-add-stop">
          <mat-icon>add</mat-icon>
        </button>
      </div>
    </div>
  }
</div>
