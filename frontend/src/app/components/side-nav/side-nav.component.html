<div class="side-nav-container" [class.mobile]="isMobile">
  <nav class="side-nav" [class.collapsed]="!isOpen()">
    <!-- Navigation items -->
    <mat-nav-list class="nav-items">
      @for (item of navItems; track item.label) {
        <a
          mat-list-item
          (click)="onNavItemClick(item)"
          (keyup.enter)="onNavItemClick(item)"
          [class.active]="item.route && router.url.includes(item.route)"
          class="nav-item"
          tabindex="0"
          role="button"
          [attr.data-testid]="'side-nav-' + item.label.toLowerCase()">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>

    <!-- Projects section -->
    @if (projectItems.length > 0) {
      <div class="projects-section">
        <div class="section-header">
          <mat-icon>collections_bookmark</mat-icon>
          <span>{{ 'project.sideNav.projects' | transloco }}</span>
        </div>
        <div class="project-tiles">
          @for (item of projectItems; track item.project.id) {
            <button
              type="button"
              class="project-tile"
              (click)="onProjectClick(item.project)"
              [class.selected]="selectedProject?.id === item.project.id"
              [class.deactivated]="!isProjectActivated(item.project)"
              [attr.data-testid]="'project-' + item.project.slug"
              [title]="item.project.title">
              <div class="tile-cover">
                <app-project-cover
                  [project]="item.project"
                  variant="small"></app-project-cover>
                @if (item.isShared) {
                  <div
                    class="shared-indicator"
                    [matTooltip]="'Shared by ' + item.sharedByUsername">
                    <mat-icon>group</mat-icon>
                  </div>
                }
                <!-- Hover overlay: prompts to download on deactivated tiles -->
                @if (!isProjectActivated(item.project)) {
                  <div
                    class="download-hint"
                    data-testid="tile-download-hint"
                    [matTooltip]="'home.clickToSyncHint' | transloco">
                    <mat-icon class="download-icon">cloud_download</mat-icon>
                  </div>
                }
                <!-- Sync overlay: shows when project is in sync queue -->
                @if (getSyncStatus(item.project)) {
                  <div
                    class="sync-overlay"
                    [class.syncing]="isSyncing(item.project)"
                    [class.queued]="isQueued(item.project)"
                    [class.synced]="isSynced(item.project)"
                    [class.failed]="hasFailed(item.project)"
                    data-testid="tile-sync-overlay">
                    @if (isSyncing(item.project)) {
                      <mat-spinner diameter="14" strokeWidth="2"></mat-spinner>
                    } @else if (isQueued(item.project)) {
                      <mat-icon class="sync-icon queued-icon"
                        >schedule</mat-icon
                      >
                    } @else if (isSynced(item.project)) {
                      <mat-icon class="sync-icon success-icon"
                        >check_circle</mat-icon
                      >
                    } @else if (hasFailed(item.project)) {
                      <mat-icon class="sync-icon error-icon">error</mat-icon>
                    }
                  </div>
                }
              </div>
              <div class="tile-info">
                <span class="tile-title">{{ item.project.title }}</span>
                <span class="tile-author">{{ item.project.username }}</span>
              </div>
              @if (activationRequired) {
                <div class="tile-actions">
                  <button
                    mat-icon-button
                    type="button"
                    class="kebab-btn"
                    [matMenuTriggerFor]="tileMenu"
                    (click)="onKebabClick($event)"
                    [attr.aria-label]="'home.projectMenu' | transloco"
                    [matTooltip]="'home.projectMenu' | transloco"
                    [attr.data-testid]="
                      'project-tile-kebab-' + item.project.slug
                    ">
                    <mat-icon>more_vert</mat-icon>
                  </button>
                  <mat-menu #tileMenu="matMenu">
                    @if (isProjectActivated(item.project)) {
                      <button
                        mat-menu-item
                        type="button"
                        (click)="requestDeactivate(item.project)"
                        [attr.data-testid]="
                          'project-tile-deactivate-' + item.project.slug
                        ">
                        <mat-icon>cloud_off</mat-icon>
                        <span>{{ 'home.deactivateAction' | transloco }}</span>
                      </button>
                    } @else {
                      <button
                        mat-menu-item
                        type="button"
                        (click)="requestActivate(item.project)"
                        [attr.data-testid]="
                          'project-tile-activate-' + item.project.slug
                        ">
                        <mat-icon>cloud_download</mat-icon>
                        <span>{{ 'home.activateAction' | transloco }}</span>
                      </button>
                    }
                  </mat-menu>
                </div>
              }
            </button>
          }
        </div>
      </div>
    }
  </nav>
</div>
