<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  @if (data.showFill) {
    <div class="color-section">
      <span class="color-label">
        <mat-icon class="label-icon">format_color_fill</mat-icon>
        {{ 'canvas.colorDialog.fillColor' | transloco }}
      </span>
      <app-color-swatches
        [selectedColor]="selectedFill"
        [allowGradient]="true"
        (colorChange)="onFillChange($event)" />
    </div>
  }
  @if (data.showStroke) {
    <div class="color-section">
      <span class="color-label">
        <mat-icon class="label-icon">border_color</mat-icon>
        {{ 'canvas.colorDialog.strokeColor' | transloco }}
      </span>
      <app-color-swatches
        [selectedColor]="selectedStroke"
        (colorChange)="onStrokeChange($event)" />
    </div>
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">{{ 'cancel' | transloco }}</button>
  <button
    mat-button
    color="primary"
    data-testid="canvas-color-confirm"
    (click)="onConfirm()">
    {{ 'apply' | transloco }}
  </button>
</mat-dialog-actions>
