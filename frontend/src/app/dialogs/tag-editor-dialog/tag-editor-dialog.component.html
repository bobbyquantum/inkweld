<h2 mat-dialog-title>
  <mat-icon>label</mat-icon>
  {{ 'dialogs.tagEditor.titlePrefix' | transloco: { name: data.elementName } }}
</h2>

<mat-dialog-content>
  <app-tag-chip-list
    [elementId]="data.elementId"
    [label]="'dialogs.tagEditor.tagsLabel' | transloco"
    [hint]="'dialogs.tagEditor.hint' | transloco">
  </app-tag-chip-list>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="close()">{{ 'done' | transloco }}</button>
</mat-dialog-actions>
