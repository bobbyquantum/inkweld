<h2 mat-dialog-title data-testid="colour-chooser-title">
  {{ data.title || ('worldbuilding.appearance.pickColour' | transloco) }}
</h2>
<mat-dialog-content>
  <div class="colour-chooser-row">
    <button
      type="button"
      class="swatch"
      [style.background]="colour()"
      [colorPicker]="colour()"
      [cpAlphaChannel]="'disabled'"
      [cpOutputFormat]="'hex'"
      [cpUseRootViewContainer]="true"
      [cpPosition]="'bottom right'"
      (colorPickerChange)="onColourChange($event)"
      data-testid="colour-chooser-swatch"
      aria-label="Pick a colour"></button>
    <span class="colour-value" data-testid="colour-chooser-value">{{
      colour()
    }}</span>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button
    mat-button
    type="button"
    (click)="onCancel()"
    data-testid="colour-chooser-cancel">
    {{ 'cancel' | transloco }}
  </button>
  <button
    mat-flat-button
    type="button"
    (click)="onApply()"
    data-testid="colour-chooser-apply">
    {{ 'apply' | transloco }}
  </button>
</mat-dialog-actions>
