@if (tutorial.currentStep(); as step) {
  <div
    #tutorialCard
    class="tutorial-card"
    [class.tutorial-card--ready]="cardReady()"
    data-testid="tutorial-card">
    <div class="tutorial-card-header">
      <h2 mat-dialog-title>{{ step.titleKey | transloco }}</h2>
      <button
        mat-icon-button
        class="tutorial-close-button"
        (click)="tutorial.dismiss()"
        [attr.aria-label]="'tutorial.closeAria' | transloco"
        data-testid="tutorial-close-button">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <p class="tutorial-card-body" aria-live="polite">
      {{ step.bodyKey | transloco }}
    </p>

    <div class="tutorial-card-footer">
      @if (!isIntroStep()) {
        <span class="tutorial-step-counter" data-testid="tutorial-step-counter">
          {{
            'tutorial.stepCounter'
              | transloco
                : {
                    current: tutorial.displayedStepNumber(),
                    total: tutorial.displayedTotalSteps(),
                  }
          }}
        </span>
      }
      <span class="tutorial-footer-spacer"></span>
      @if (isIntroStep()) {
        <button
          mat-button
          (click)="tutorial.dismiss()"
          data-testid="tutorial-not-now-button">
          {{ 'tutorial.notNow' | transloco }}
        </button>
        <button
          mat-raised-button
          color="primary"
          cdkFocusInitial
          (click)="tutorial.next()"
          data-testid="tutorial-start-button">
          {{ 'tutorial.startTour' | transloco }}
        </button>
      } @else {
        <button
          mat-button
          (click)="tutorial.previous()"
          data-testid="tutorial-back-button">
          {{ 'back' | transloco }}
        </button>
        <button
          mat-raised-button
          color="primary"
          cdkFocusInitial
          (click)="tutorial.next()"
          data-testid="tutorial-next-button">
          {{ (isLastStep() ? 'done' : 'next') | transloco }}
        </button>
      }
    </div>
  </div>
}
