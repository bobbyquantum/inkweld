<h2 mat-dialog-title data-testid="confirmation-dialog-title">
  {{ data.title }}
</h2>
<mat-dialog-content>
  <p data-testid="confirm-dialog-message">{{ data.message }}</p>

  @if (details() && details().length > 0) {
    <ul class="details-list">
      @for (detail of details(); track detail) {
        <li>{{ detail }}</li>
      }
    </ul>
  }

  @if (data.requireConfirmationText) {
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{
        'dialogs.confirmation.typeToConfirm'
          | transloco: { text: data.requireConfirmationText }
      }}</mat-label>
      <input
        matInput
        id="confirm-dialog-input"
        [attr.aria-label]="'dialogs.confirmation.typeToConfirmAria' | transloco"
        [(ngModel)]="confirmationInput"
        [placeholder]="
          'dialogs.confirmation.typeToConfirmPlaceholder' | transloco
        "
        data-testid="confirm-dialog-input" />
    </mat-form-field>
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()" data-testid="cancel-dialog-button">
    {{ data.cancelText || ('cancel' | transloco) }}
  </button>
  <button
    mat-button
    color="warn"
    (click)="onConfirm()"
    data-testid="confirm-delete-button"
    [disabled]="
      data.requireConfirmationText &&
      confirmationInput !== data.requireConfirmationText
    ">
    {{ data.confirmText || ('confirm' | transloco) }}
  </button>
</mat-dialog-actions>
