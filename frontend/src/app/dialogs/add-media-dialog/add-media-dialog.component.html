<h2 mat-dialog-title>{{ 'dialogs.addMedia.title' | transloco }}</h2>
<mat-dialog-content>
  <div class="options">
    <button
      class="option-card"
      (click)="select('upload')"
      data-testid="add-media-upload">
      <mat-icon>upload_file</mat-icon>
      <span class="option-label">{{
        'dialogs.addMedia.uploadImage' | transloco
      }}</span>
      <span class="option-desc">{{
        'dialogs.addMedia.uploadImageDesc' | transloco
      }}</span>
    </button>
    <button
      class="option-card"
      [disabled]="!data.canGenerate"
      [title]="data.generateTooltip ?? ''"
      (click)="select('generate')"
      data-testid="add-media-generate">
      <mat-icon>auto_awesome</mat-icon>
      <span class="option-label">{{
        'dialogs.addMedia.generateWithAI' | transloco
      }}</span>
      <span class="option-desc">{{
        'dialogs.addMedia.generateWithAIDesc' | transloco
      }}</span>
    </button>
  </div>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button mat-dialog-close data-testid="add-media-cancel">
    {{ 'cancel' | transloco }}
  </button>
</mat-dialog-actions>
