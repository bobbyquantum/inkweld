<section class="settings-section">
  <mat-slide-toggle
    [checked]="confirmElementMoves"
    (change)="setConfirmElementMoves($any($event).checked)">
    {{ 'settings.projectTreeTab.confirmMoves' | transloco }}
  </mat-slide-toggle>
  <mat-slide-toggle
    [checked]="showBreadcrumbs"
    (change)="setShowBreadcrumbs($any($event).checked)"
    data-testid="show-breadcrumbs-toggle">
    {{ 'settings.projectTreeTab.showBreadcrumbs' | transloco }}
  </mat-slide-toggle>
  <mat-slide-toggle
    [checked]="folderClickOpens"
    (change)="setFolderClickOpens($any($event).checked)"
    data-testid="folder-click-opens-toggle">
    {{ 'settings.projectTreeTab.folderClickOpens' | transloco }}
  </mat-slide-toggle>
</section>
