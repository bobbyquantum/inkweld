<section class="settings-section">
  <mat-checkbox
    [checked]="confirmElementMoves"
    (change)="setConfirmElementMoves($event.checked)">
    Confirm element moves
  </mat-checkbox>
  <mat-checkbox
    [checked]="showBreadcrumbs"
    (change)="setShowBreadcrumbs($event.checked)"
    data-testid="show-breadcrumbs-toggle">
    Show breadcrumbs above editors
  </mat-checkbox>
</section>
