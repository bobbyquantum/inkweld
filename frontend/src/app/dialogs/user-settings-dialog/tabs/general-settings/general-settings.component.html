<!-- Theme Selection -->
<mat-form-field appearance="outline">
  <mat-label>Theme</mat-label>
  <mat-select [(ngModel)]="selectedTheme" (selectionChange)="onThemeChange()">
    <mat-option value="system">Follow System</mat-option>
    <mat-option value="light-theme">Light</mat-option>
    <mat-option value="dark-theme">Dark</mat-option>
  </mat-select>
</mat-form-field>

<!-- Language Selection -->
<mat-form-field appearance="outline">
  <mat-label>Language</mat-label>
  <mat-select
    [(ngModel)]="selectedLang"
    (selectionChange)="onLangChange()"
    [disabled]="!isMultiLang"
    matTooltip="More languages coming soon">
    @for (lang of availableLangs; track lang) {
      <mat-option [value]="lang.id">{{ lang.label }}</mat-option>
    }
  </mat-select>
</mat-form-field>
