<h2 mat-dialog-title>{{ 'dialogs.addComment.title' | transloco }}</h2>

<mat-dialog-content>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>{{ 'dialogs.addComment.commentLabel' | transloco }}</mat-label>
    <textarea
      matInput
      id="add-comment-text"
      [attr.aria-label]="'dialogs.addComment.commentAria' | transloco"
      [(ngModel)]="commentText"
      [placeholder]="'dialogs.addComment.placeholder' | transloco"
      rows="3"
      maxlength="2000"
      cdkTextareaAutosize
      data-testid="comment-text-input"
      (keydown.meta.enter)="onSubmit()"
      (keydown.control.enter)="onSubmit()"></textarea>
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()" data-testid="cancel-comment-btn">
    {{ 'cancel' | transloco }}
  </button>
  <button
    mat-raised-button
    color="primary"
    [disabled]="!commentText.trim()"
    (click)="onSubmit()"
    data-testid="submit-comment-btn">
    {{ 'dialogs.addComment.comment' | transloco }}
  </button>
</mat-dialog-actions>
