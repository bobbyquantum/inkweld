<div class="callback-container">
  @if (errorMessage) {
    <div class="error">
      <h2>{{ 'auth.oauthCallback.signInFailed' | transloco }}</h2>
      <p>{{ errorMessage }}</p>
      <a href="/">{{ 'auth.oauthCallback.returnHome' | transloco }}</a>
    </div>
  } @else {
    <mat-spinner diameter="40"></mat-spinner>
    <p>{{ 'auth.oauthCallback.completing' | transloco }}</p>
  }
</div>
