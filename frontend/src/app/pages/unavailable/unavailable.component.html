<div class="container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>{{ 'app.unavailable.title' | transloco }}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <p>
        {{ 'app.unavailable.message' | transloco }}
      </p>
    </mat-card-content>
    <mat-card-actions>
      <button mat-button color="primary" routerLink="/">
        {{ 'retry' | transloco }}
      </button>
    </mat-card-actions>
  </mat-card>
</div>
