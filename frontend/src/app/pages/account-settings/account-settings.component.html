<div class="account-settings-container">
  <mat-toolbar color="primary" class="settings-toolbar">
    <button mat-icon-button routerLink="/" data-testid="account-settings-back">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <span class="toolbar-title">{{
      'settings.accountTab.title' | transloco
    }}</span>
  </mat-toolbar>

  <div class="settings-content">
    <section class="settings-section">
      <h2>
        <mat-icon>smart_toy</mat-icon>
        {{ 'settings.authorizedAppsTab.title' | transloco }}
      </h2>
      <p class="section-description">
        {{ 'settings.authorizedAppsTab.description' | transloco }}
      </p>
      <app-authorized-apps></app-authorized-apps>
    </section>

    <mat-divider></mat-divider>

    @if (systemConfig.isPasskeyManagementAvailable()) {
      <section class="settings-section">
        <app-passkeys-settings></app-passkeys-settings>
      </section>
    }
  </div>
</div>
